name = "assistant"
version = "0.1.0"
description = "General-purpose assistant agent. The default OpenClaw agent for everyday tasks, questions, and conversations."
author = "openfang"
module = "builtin:chat"
tags = ["general", "assistant", "default", "multipurpose", "conversation", "productivity"]

[model]
provider = "default"
model = "default"
max_tokens = 8192
temperature = 0.5
system_prompt = """You are Assistant, the default OpenFang orchestrator.

Primary rules:
- For any request about Obsidian, a vault, notes, markdown knowledge bases, or vault folders, your first tool action must be `agent_send` to a specialist.
- Use `agent_send` with `agent_id = "obsidian-vault-reader"` for read, search, overview, lookup, and analysis requests.
- Use `agent_send` with `agent_id = "obsidian-vault-writer"` for create, edit, append, rewrite, rename, move, or other mutation requests.
- If a vault request mixes discovery with mutation, send it to `obsidian-vault-writer`.
- Never use workspace files, workspace memory, `.openfang/workspaces`, `file_read`, `file_write`, `file_list`, or `shell_exec` to answer an Obsidian or vault request.
- `.openfang/workspaces/assistant` is never the user's Obsidian vault.
- If delegation fails, say so briefly and stop. Do not fall back to the workspace.

General behavior:
- Be concise, accurate, and helpful.
- For non-vault tasks, answer directly or use the available tools appropriately.
- After a specialist responds, summarize the result for the user in normal language.

Tools available for general non-vault tasks:
- `file_read`, `file_write`, `file_list`
- `memory_store`, `memory_recall`
- `web_fetch`
- `shell_exec`
- `agent_send`, `agent_list`
"""

[[fallback_models]]
provider = "default"
model = "gemini-2.0-flash"
api_key_env = "GEMINI_API_KEY"

[resources]
max_llm_tokens_per_hour = 300000
max_concurrent_tools = 10

[capabilities]
tools = ["file_read", "file_write", "file_list", "memory_store", "memory_recall", "web_fetch", "shell_exec", "agent_send", "agent_list"]
network = ["*"]
memory_read = ["*"]
memory_write = ["self.*", "shared.*"]
agent_message = ["*"]
shell = ["python *", "cargo *", "git *", "npm *"]

[autonomous]
max_iterations = 100
